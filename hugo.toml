baseURL = 'https://necauq.ua/'

languageCode = 'en-us'

title = 'necauq.ua'

# my fork with couple of fixes and customizations
theme = 'github.com/necauqua/hugo-theme-cactus'
# theme = '/home/necauqua/projects/contrib/hugo-theme-cactus'

enableGitInfo = true
frontmatter.lastmod = ['modified', 'date']

# make the file structure not suck ass
themesDir = 'src/themes'
publishDir = 'build/public'
resourceDir = 'build/resources'

[module]
[[module.mounts]]
source = 'src/content'
target = 'content'
[[module.mounts]]
source = 'src/data'
target = 'data'
[[module.mounts]]
source = 'src/layouts'
target = 'layouts'
[[module.mounts]]
source = 'src/i18n'
target = 'i18n'
[[module.mounts]]
source = 'src/archetypes'
target = 'archetypes'
[[module.mounts]]
source = 'src/assets'
target = 'assets'
[[module.mounts]]
source = 'src/static'
target = 'static'

[markup.goldmark.renderer]
unsafe = true

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Posts"
url = "/posts"
weight = 2

[[menu.main]]
name = "Tags"
url = "/tags"
weight = 3

# [[menu.main]]
# name = "About"
# url = "/about"
# weight = 4

[params]
colortheme = 'dark'
rss = true
# tagsOverview = true # todo: reenable once we have more pages so the overview is not giant

logo = 'avatar.jpg'

show_updated = true
showReadTime = true
dateFormat = '2006-01-02' # go date formatting is so annoying, you cant add 1 to get HE dates

mainSectionTitle = "Posts"
postsOnHomePage = 10

css = ["css/custom.css"]

[params.comments]
enabled = false # todo enable after pushed to github?.
engine = 'utterances'

[params.comments.utterances]
repo = 'necauqua/necauq.ua'
label = 'comment'
theme = 'github-dark'

[[params.social]]
