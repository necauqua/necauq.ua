categories:
- name: Betting
  commands:
  - name: mkbet
    doc: |
      Create a new bet. If no options are provided, they default to "believe" and "doubt".
    args:
    - name: premise
      doc: string
      optional: false
    - name: options
      doc: the rest of the arguments
      optional: false
    permission: Caster
  - name: close
    doc: |
      Close the current bet, preventing new bets from being placed.
    permission: Caster
  - name: reopen
    doc: |
      Reopen a closed bet, allowing new bets to be placed.
    permission: Caster
  - name: is-bet
    doc: |
      Show the current active bet.
    sender_gate: '10s'
  - name: bet
    doc: |
      Place a bet on the current active bet.

      If you dont wager anything, you will still win 1⚡︎ if you were correct.
    args:
    - name: option
      doc: string
      optional: false
    - name: wager
      doc: a number of charges, in form of a number with up to 3 decimal places, optional
      optional: true
    sender_gate: '5s'
  - name: get-bet
    doc: |
      Get your current bet, if any.
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '5s'
  - name: unbet
    doc: |
      Remove your bet from the current active bet, refunding your wager.
    sender_gate: '5s'
  - name: cancel-bet
    doc: |
      Cancel the current bet, refunding all wagers.
    permission: Caster
  - name: rollback
    doc: |
      Rollback the last settled bet, returning all winnings to the users and
      restoring the bet state.

      This is obviously to fix potential fat-finger mistakes.
    permission: Caster
  - name: settle
    doc: |
      Settle the current bet, paying out the users who bet on the given option.
    args:
    - name: option
      doc: string
      optional: false
    permission: Caster
- name: Data
  commands:
  - name: seed
    doc: |
      Read the current seed
    global_gate: '15s'
  - name: death-count
    doc: |
      Read the current death count
    global_gate: '15s'
    shortcode: deaths
  - name: kicks
    doc: |
      The amount of kicks registered by the game in the current run
    global_gate: '15s'
  - name: perks
    doc: |
      Read the currently picked up perks. Look ma, streamer wands at home!
    args:
    - name: top-n
      doc: a non-negative number, optional
      optional: true
    global_gate: '5s'
  - name: damage-multipliers
    doc: |
      Read the current non-1 damage multipliers of the player entity.
    permission: Subscriber
    global_gate: '5s'
  - name: check-flag
    doc: |
      Checks if the persistent flag was set in the running save.
    args:
    - name: flag
      doc: string
      optional: false
    global_gate: '5s'
  - name: pillar-progress
    doc: |
      Shows the amount of completed pillars vs total.
    global_gate: '5s'
  - name: pillar-todo
    doc: |
      Shows all the pillar achievements not yet completed in the running save.
    args:
    - name: top-n
      doc: a non-negative number, optional
      optional: true
    global_gate: '5s'
  - name: pillars-done
    doc: |
      Shows all the pillar achievements already completed in the running save.
    args:
    - name: top-n
      doc: a non-negative number, optional
      optional: true
    global_gate: '5s'
  - name: player-pos
    doc: |
      Prints the current player position in pixels
    permission: Subscriber
  - name: entity-count
    doc: |
      Count the amount of loaded entities.

      Can be filtered down by tags, for example `entity-count:gold_nugget~`.
    args:
    - name: tags
      doc: the rest of the arguments
      optional: false
    permission: Subscriber
    sender_gate: '5s'
  - name: entity-tag-counts
    doc: |
      Aggregate a top list of tags that mark loaded entities.
    permission: Subscriber
    sender_gate: '5s'
- name: Economy
  commands:
  - name: balance
    doc: |
      Check the current charge balance
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '3s'
    shortcode: b
  - name: unleash-me
    doc: |
      Spend a charge to remove all of your current timeouts.
    cost: '1⚡︎'
  - name: transfer
    doc: |
      Transfer some of your charges to another user.

      When run from global macros, the amount can be negative to "steal" charges.
      This can be used by mods to set up macros that reward users.
    args:
    - name: target
      doc: a user login
      optional: false
    - name: amount
      doc: a number of charges, in form of a number with up to 3 decimal places
      optional: false
    global_macro_exempt: true
    sender_gate: '3s'
    cost: '0.004⚡︎'
  - name: award
    doc: |
      Conjure some charges out of thin air and award them to a user.

      The amount can be negative 🙃
    args:
    - name: target
      doc: a user login, defaults to you
      optional: true
    - name: amount
      doc: a number of charges, in form of a number with up to 3 decimal places
      optional: false
    permission: Caster
  - name: ping
    doc: |
      Respond with "pong!".

      I heard that scarcity creates value, so getting a pong is very _cool_ and
      _pog_, because only one person can get it in an hour-ish.

      This command has a dynamic global gate of 55-65 minutes, chosen at random.

      Ping fails if you were the last person to do it!

      There is also some magical property to this command..
    cost: '-1⚡︎'
  - name: last-pinger
    doc: |
      Get the name of the last person who got the `ping~` command during the
      current stream.
    sender_gate: '15s'
  - name: hello
    doc: |
      Say hi to the stream!
    sender_gate: '12h'
    shortcode: hi
    cost: '-0.2⚡︎'
- name: Macros
  commands:
  - name: macro-record
    doc: |
      Stores a string as a personal macro.

      Commands can accept complicated strings if you put them in quotes like so:
      ```tpn
      macro-record:hop:"wait~ up~ wait~ up~ wait~ up~ wait~ up~"~
      ```
    args:
    - name: name
      doc: string
      optional: false
    - name: script
      doc: a script string that _will not have it's vars expanded_
      optional: false
    shortcode: mr
  - name: macro-delete
    doc: |
      Deletes a macro created with `macro-record~`.
    args:
    - name: name
      doc: string
      optional: false
    shortcode: md
  - name: global-macro-record
    doc: |
      Stores a string as a global macro, meaning it can be used by everyone.
    args:
    - name: name
      doc: string
      optional: false
    - name: script
      doc: a script string that _will not have it's vars expanded_
      optional: false
    permission: Moderator
    shortcode: gmr
  - name: global-macro-delete
    doc: |
      Deletes a macro created with `global-macro-record~`.
    args:
    - name: name
      doc: string
      optional: false
    permission: Moderator
    shortcode: gmd
  - name: macro-print
    doc: |
      Replies with the stored macro.

      Can peek at other users macros if their login is specified, they're all
      public here.
    args:
    - name: name
      doc: string
      optional: false
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '5s'
    shortcode: mp
  - name: global-macro-print
    doc: |
      Replies with the stored global macro.
    args:
    - name: name
      doc: string
      optional: false
    sender_gate: '5s'
    shortcode: gmp
  - name: macro-list
    doc: |
      List macros you/given chatter has recorded.
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '5s'
    shortcode: ml
  - name: global-macro-list
    doc: |
      List global macros recorded.
    sender_gate: '5s'
    shortcode: gml
  - name: yoink
    doc: |
      Copy someones macro to yourself.
    args:
    - name: name
      doc: string
      optional: false
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    - name: rename
      doc: string, optional
      optional: true
  - name: macro
    doc: |
      Run the macro.

      Macros can call other macros, but there is a recursion limit!

      Also you can run a macro recorded by someone else by appending their login
      as the second argument.
    args:
    - name: name
      doc: string
      optional: false
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    - name: rest
      doc: the rest of the arguments
      optional: false
    shortcode: q
  - name: repeat
    doc: |
      Execute a given string several times.

      ```tpn
      jump five times: repeat:5:" wait~ up~ "~
      ```

      The total limit of repetitions in a given message is 1000! This counts all
      repetitions, nested in each other or inside of macros etc etc. Once the
      limit is reached, the command will error out.
    args:
    - name: times
      doc: a number in range from 0 to 1000
      optional: false
    - name: script
      doc: a script string that _will not have it's vars expanded_
      optional: false
  - name: group
    doc: |
      Executes a given string, basically identical to `repeat:1:"script"`.

      This is useful to group together parallel actions, for example:
      ```tpn
      wait:5s~ group:" up~ | left~ "~
      ```

      Additionally, there is an optional name that you can attach to the group to
      have it shown on the status wall.
    args:
    - name: script
      doc: a script string
      optional: false
    - name: custom-status-name
      doc: string, optional
      optional: true
    shortcode: g
  - name: try
    doc: |
      Similarly to `group`, executes a given string without counting towards
      limits.

      The difference is that any script errors are ignored, and this command
      always succeeds, without preventing the repeats from continuing or setting
      last-error.
    args:
    - name: script
      doc: a script string
      optional: false
  - name: loop
    doc: |
      Repeatedly execute a given script indefinitely - until an interrupt is
      sent.

      A special condition: a single loop iteration must take at least 100ms,
      otherwise after the first iteration the command will error out.

      Unless you have a repeat _inside_ of the loop that exceeds it, the loop is
      not limited by the repeat limit.

      The only way to stop a running loop is `interrupt~`, and putting a loop
      inside of a loop is obviously pointless.

      ```tpn
      stalling: repeat:5:" wait~ up~ "~
      ```
    args:
    - name: script
      doc: a script string that _will not have it's vars expanded_
      optional: false
    permission: Subscriber
  - name: math
    doc: |
      Evaluates and prints a given math expression. Mostly useful for debugging
      my calculator bugs :(
    args:
    - name: value
      doc: a number
      optional: false
    sender_gate: '3s'
  - name: set
    doc: |
      Stores text that will be replaced in any commands you
      call (including macros) if you reference it as `%name`.

      Note that while this command accepts text, an argument wrapped in
      parenthesis - without quotes or braces - will be passed through the
      calculator first as if the command expected a number.
    args:
    - name: name
      doc: string
      optional: false
    - name: value
      doc: string, optional
      optional: true
  - name: global-set
    doc: |
      A moderator-only version of `set~` that sets a global variable instead of a
      personal one.

      Global variables will be replaced by anyone referencing them as `%name`,
      unless they have their own personal variable with the same name, which
      would take precedence.
    args:
    - name: name
      doc: string
      optional: false
    - name: value
      doc: string, optional
      optional: true
    permission: Moderator
  - name: let
    doc: |
      Similar to `set~`, but the text is only stored for the chat message being executed.
    args:
    - name: name
      doc: string
      optional: false
    - name: value
      doc: string, optional
      optional: true
  - name: del
    doc: |
      Deletes a variable. Can delete more than one at once.
    args:
    - name: names
      doc: the rest of the arguments
      optional: false
  - name: list-vars
    doc: |
      Lists all of your variables.
    sender_gate: '5s'
  - name: get
    doc: |
      A debug command that replies with the value of the given variable.
    args:
    - name: name
      doc: string
      optional: false
    sender_gate: '5s'
  - name: clear
    doc: |
      Clears all of your variables.
  - name: if-eq
    doc: |
      Runs the `then` script if given values are equal, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: string
      optional: false
    - name: b
      doc: string
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
  - name: if-ne
    doc: |
      Runs the `then` script if given values are not equal, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: string
      optional: false
    - name: b
      doc: string
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
  - name: if-ge
    doc: |
      Runs the `then` script if the first number is greater than or equal to the second, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: a number
      optional: false
    - name: b
      doc: a number
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
  - name: if-gt
    doc: |
      Runs the `then` script if the first number is greater than the second, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: a number
      optional: false
    - name: b
      doc: a number
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
  - name: if-le
    doc: |
      Runs the `then` script if the first number is less than or equal to the second, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: a number
      optional: false
    - name: b
      doc: a number
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
  - name: if-lt
    doc: |
      Runs the `then` script if the first number is less than the second, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: a number
      optional: false
    - name: b
      doc: a number
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
- name: Moderation
  commands:
  - name: banish
    doc: |
      Instantly banish a user to the shadow realm.

      Can be temporary if a duration is provided.
    args:
    - name: chatter
      doc: a user login
      optional: false
    - name: duration
      doc: duration in freeform format (using `humantime` Rust library), so `10s`, or `2 minutes` or `1h30m` etc, optional
      optional: true
    permission: TwitchStaff
  - name: unbanish
    doc: |
      Restore users ability to use the bot, bringing them back from the shadow
      realm regardless of their crimes.
    args:
    - name: chatter
      doc: a user login
      optional: false
    permission: Moderator
  - name: banished
    doc: |
      Check if a user was yeeted into the shadow realm.

      If _you_ are yeeted, the bot ignores you utterly, so this won't work
      ¯\\\_(ツ)_/¯.
    args:
    - name: chatter
      doc: a user login
      optional: false
    sender_gate: '15s'
  - name: set-title
    doc: |
      Set the stream title, common moderation command, nothing special here.
    args:
    - name: title
      doc: string
      optional: false
    permission: Moderator
    global_gate: '5s'
- name: Sounds
  commands:
  - name: tts
    doc: |
      Say something on stream through the TTS.
    args:
    - name: msg
      doc: string
      optional: false
    global_macro_exempt: true
    sender_gate: '1m'
    cost: '0.5⚡︎'
    free_for: Subscriber
  - name: play-sound
    doc: |
      Play a sound on stream.
      Sounds ids are secret, but look through `global-macro-list~` for macros that
      use this command to get an idea of what sounds are available.

      Sender gate is at least 10 seconds for everything, but individual sounds
      have their own dynamic cooldowns.
    args:
    - name: sound-id
      doc: string
      optional: false
    permission: Caster
    global_macro_exempt: true
    sender_gate: '10s'
  - name: now-playing
    doc: |
      Get the title of the song that's currently playing on stream, if any.
    global_gate: '5s'
    shortcode: np
  - name: volume
    doc: |
      Get or set the YouTube Music volume.
    args:
    - name: volume
      doc: a number in range from 0 to 100, optional
      optional: true
    permission: Vip
    sender_gate: '3s'
    shortcode: v
  - name: skip
    doc: |
      Skips the song that's currently playing on stream, if any.
    global_gate: '15s'
    cost: '1⚡︎'
    free_for: Vip
  - name: unskip
    doc: |
      A "back" button, undoes skips or otherwise goes back to the previous song.
    global_gate: '15s'
    cost: '1⚡︎'
    free_for: Vip
  - name: pause
    doc: |
      Pause/unpause the music.
    args:
    - name: state
      doc: a boolean value (true/t/yes/y/1 or false/f/no/n/0), optional
      optional: true
    permission: Moderator
  - name: song-request
    doc: |
      Adds the given song to the YouTube Music queue.

      This only accepts YouTube links or IDs.

      Note that the song will be added to the front of the queue - this is
      because usually the queue is full of songs from my stream playlist and the
      point of the command is to show me a song you think I wont insta-skip :)

      The `extra` parameter is used to allow specifying full URLs without quotes.
      For example, `sr:https://youtu.be/dQw4w9WgXcQ` <- here the first argument
      is actually `"https"` and the `extra` is `"//youtu.be/dQw4w9WgXcQ"`.
    args:
    - name: url-or-id
      doc: string
      optional: false
    - name: extra
      doc: string, optional
      optional: true
    sender_gate: '1m'
    shortcode: sr
  - name: cancel-request
    doc: |
      Removes the last song you requested from the queue.
    sender_gate: '5s'
    shortcode: cr
  - name: music-queue
    doc: |
      List the songs that were requested through `song-request~`.
    args:
    - name: top
      doc: a non-negative number, optional
      optional: true
    global_gate: '30s'
    shortcode: mq
  - name: clear-music-queue
    doc: |
      A helper command to help fix potential music queue issues.
    permission: Moderator
    shortcode: cmq
- name: Stats
  commands:
  - name: stat
    doc: |
      Count the amount of messages typed by a chatter.

      If given a word, counts the messages containing it (given string can give
      multiple words separated by spaces).

      Login defaults to the sender (you can do `stat::word~` too).
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    - name: word
      doc: string, optional
      optional: true
    sender_gate: '3s'
  - name: stat-global
    doc: |
      Similar to `stat` except works across all of chat.

      Without an argument counts all messages ever typed in chat since I started
      archiving it (which is way before the Twitch Plays Noita happened).

      With an argument filters messages by the given word(s), just like `stat`.
    args:
    - name: word
      doc: string, optional
      optional: true
    sender_gate: '3s'
  - name: first-message
    doc: |
      Get the first message sent by a user (or you) in chat.
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '3s'
  - name: last-message
    doc: |
      Get the last message sent by a user (or you) in chat.
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '3s'
  - name: top
    doc: |
      Get a list of top-N chatters of all time, by number of sent messages.
    args:
    - name: 'n'
      doc: a number in range from 1 to 15, optional
      optional: true
    sender_gate: '10m'
  - name: rank
    doc: |
      Get the place of the chatter (or you) in the "leaderboard" of how many messages they ~~spammed~~ sent
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '1m'
  - name: command-stat
    doc: |
      Get the amount of times you or some other chatter has successfully(!) used
      the given command (does not work with shortcodes, use the full command
      name).

      Note that the accurate counting only started since the introduction of this
      command (with ping~ manually backfilled from chat logs of bot replies).
    args:
    - name: name
      doc: string
      optional: false
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '15s'
- name: Util
  commands:
  - name: echo
    doc: |
      A building block for basic static text commands.

      This just makes the bot print the given text, but non-moderators can only call it through global macros.

      So you can call a global macro `discord~` which will resolve to `echo:"discord link etc"~` and print it.
    args:
    - name: text
      doc: string
      optional: false
    permission: Caster
    global_macro_exempt: true
    sender_gate: '5s'
  - name: last-error
    doc: |
      Respond with the last error message for user.

      Last error message is set when you run invalid commands, or if the command
      execution managed to crash somehow. In the latter case, you'll be given the
      message id - please send it to me to look at logs and fix the issue.
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '3s'
    shortcode: le
  - name: is-game-running
    doc: |
      Check if noita.exe process is present, aka not dead.
    sender_gate: '1m'
  - name: wait
    doc: |
      Wait for a specified duration milliseconds.

      Very useful for multi-command messages.
    args:
    - name: duration
      doc: duration in milliseconds, will be limited to at most 300000, defaults to 500
      optional: true
    shortcode: w
  - name: break
    doc: |
      Complete all current holds immediately.

      "Holds" here are referring to all "non-instantaneous" commands that are
      currently being executed **right now** - so movement, `hold~` and `wait~`.

      This is kind of a niche thing, most likely you need `interrupt~`.
    args:
    - name: chatter
      doc: a user login, optional
      optional: true
  - name: interrupt
    doc: |
      Stop running all current commands.

      This is similar to `break~`, except the commands following the holds that
      get completed do not run.
    args:
    - name: chatter
      doc: a user login, optional
      optional: true
  - name: discard
    doc: |
      Interrupt all commands *originating from the current message*.

      On it's own this does nothing, but it can be used to limit the duration of
      the current message or similar.
  - name: setting
    doc: |
      Set a bot setting.

      Settings that currently do things are:
      - `full-stop`: disables processing any commands from non-mods
      - `nosr`: disables song requests

      If the key argument is prefixed with `-` the setting is removed (value is
      ignored).
    args:
    - name: key
      doc: string
      optional: false
    - name: value
      doc: string, optional
      optional: true
    permission: Moderator
  - name: what-is
    doc: |
      Get information about a macro or command.

      If you see someone running some weird command, run
      `what-is:command:their-name~` to figure out what it was.
    args:
    - name: name
      doc: string
      optional: false
    - name: to
      doc: a user login, defaults to you
      optional: true
    sender_gate: '3s'
permissions:
- name: Caster
  description: Only the broadcaster can use this command.
  level: 7
- name: Moderator
  description: Channel moderators and above can use this command.
  level: 6
- name: TwitchAdmin
  description: Twitch administrators and above can use this command.
  level: 5
- name: TwitchStaff
  description: Twitch staff and above can use this command.
  level: 4
- name: Vip
  description: Channel VIPs and above can use this command.
  level: 3
- name: Verified
  description: Verified users (partners) and above can use this command.
  level: 2
- name: Subscriber
  description: Channel subscribers and above can use this command.
  level: 1
