categories:
- name: Data
  commands:
  - name: seed
    doc: |
      Read the current seed
    permission: Vip
    global_gate: '15s'
  - name: death-count
    doc: |
      Read the current death count
    global_gate: '15s'
    shortcode: deaths
  - name: kicks
    doc: |
      The amount of kicks registered by the game in the current run
    global_gate: '15s'
  - name: perks
    doc: |
      Read the currently picked up perks. Look ma, streamer wands at home!
    args:
    - name: top-n
      doc: a non-negative number, optional
      optional: true
    global_gate: '5s'
  - name: damage-multipliers
    doc: |
      Read the current non-1 damage multipliers of the player entity.
    permission: Vip
    global_gate: '5s'
  - name: check-flag
    doc: |
      Checks if the persistent flag was set in the running save.
    args:
    - name: flag
      doc: string
      optional: false
    global_gate: '5s'
  - name: pillar-progress
    doc: |
      Shows the amount of completed pillars vs total.
    global_gate: '5s'
  - name: pillar-todo
    doc: |
      Shows all the pillar achievements not yet completed in the running save.
    args:
    - name: top-n
      doc: a non-negative number, optional
      optional: true
    global_gate: '5s'
  - name: pillars-done
    doc: |
      Shows all the pillar achievements already completed in the running save.
    args:
    - name: top-n
      doc: a non-negative number, optional
      optional: true
    global_gate: '5s'
  - name: spell-progress
    doc: |
      Shows the amount of unique spells ever cast vs total.
    global_gate: '5s'
  - name: spell-todo
    doc: |
      Shows all the spells that were never cast in the running save.
    args:
    - name: top-n
      doc: a non-negative number, optional
      optional: true
    global_gate: '5s'
  - name: spells-done
    doc: |
      Shows all the spells that were already cast in the running save.
    args:
    - name: top-n
      doc: a non-negative number, optional
      optional: true
    global_gate: '5s'
  - name: player-pos
    doc: |
      Prints the current player position in pixels
    permission: Moderator
  - name: entity-count
    doc: |
      Count the amount of loaded entities.

      Can be filtered down by tags, for example `entity-count:gold_nugget~`.
    args:
    - name: tags
      doc: the rest of the arguments
      optional: false
    permission: Subscriber
    sender_gate: '5s'
  - name: entity-tag-counts
    doc: |
      Aggregate a top list of tags that mark loaded entities.
    permission: Vip
    sender_gate: '5s'
- name: Economy
  commands:
  - name: balance
    doc: |
      Check your current balance of charges
    sender_gate: '3s'
  - name: unleash-me
    doc: |
      Spend a charge to remove all of your current timeouts.
- name: Macros
  commands:
  - name: macro-record
    doc: |
      Stores a string as a personal macro.

      Commands can accept complicated strings if you put them in quotes like so:
      ```tpn
      macro-record:hop:"wait~ up~ wait~ up~ wait~ up~ wait~ up~"~
      ```
    args:
    - name: name
      doc: string
      optional: false
    - name: script
      doc: a script string that _will not have it's vars expanded_
      optional: false
    shortcode: mr
  - name: macro-delete
    doc: |
      Deletes a macro created with `macro-record~`.
    args:
    - name: name
      doc: string
      optional: false
    shortcode: md
  - name: global-macro-record
    doc: |
      Stores a string as a global macro, meaning it can be used by everyone.
    args:
    - name: name
      doc: string
      optional: false
    - name: script
      doc: a script string that _will not have it's vars expanded_
      optional: false
    permission: Moderator
    shortcode: gmr
  - name: global-macro-delete
    doc: |
      Deletes a macro created with `global-macro-record~`.
    args:
    - name: name
      doc: string
      optional: false
    permission: Moderator
    shortcode: gmd
  - name: macro-print
    doc: |
      Replies with the stored macro.

      Can peek at other users macros if their login is specified, they're all
      public here.
    args:
    - name: name
      doc: string
      optional: false
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '5s'
    shortcode: mp
  - name: global-macro-print
    doc: |
      Replies with the stored global macro.
    args:
    - name: name
      doc: string
      optional: false
    sender_gate: '5s'
    shortcode: gmp
  - name: macro-list
    doc: |
      List macros you/given chatter has recorded.
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '5s'
    shortcode: ml
  - name: global-macro-list
    doc: |
      List global macros recorded.
    sender_gate: '5s'
    shortcode: gml
  - name: yoink
    doc: |
      Copy someones macro to yourself.
    args:
    - name: name
      doc: string
      optional: false
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    - name: rename
      doc: string, optional
      optional: true
  - name: macro
    doc: |
      Run the macro.

      Macros can call other macros, but there is a recursion limit!

      Also you can run a macro recorded by someone else by appending their login
      as the second argument.
    args:
    - name: name
      doc: string
      optional: false
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    - name: rest
      doc: the rest of the arguments
      optional: false
    shortcode: q
  - name: repeat
    doc: |
      Execute a given string several times.

      ```tpn
      jump five times: repeat:5:" wait~ up~ "~
      ```

      The total limit of repetitions in a given message is 1000! This counts all
      repetitions, nested in each other or inside of macros etc etc. Once the
      limit is reached, the command will error out.
    args:
    - name: times
      doc: a number in range from 0 to 1000
      optional: false
    - name: script
      doc: a script string that _will not have it's vars expanded_
      optional: false
  - name: group
    doc: |
      Executes a given string, basically identical to `repeat:1:"script"`.

      This is useful to group together parallel actions, for example:
      ```tpn
      wait:5s~ group:" up~ | left~ "~
      ```

      Additionally, there is an optional name that you can attach to the group to
      have it shown on the status wall.
    args:
    - name: script
      doc: a script string
      optional: false
    - name: custom-status-name
      doc: string, optional
      optional: true
    shortcode: g
  - name: try
    doc: |
      Similarly to `group`, executes a given string without counting towards
      limits.

      The difference is that any script errors are ignored, and this command
      always succeeds, without preventing the repeats from continuing or setting
      last-error.
    args:
    - name: script
      doc: a script string
      optional: false
  - name: lock
    doc: |
      Similarly to `group`, executes a given string without counting towards
      limits.

      The difference is that only one `lock` script can run at a time, if
      one is already running this command does nothing.
    args:
    - name: script
      doc: a script string
      optional: false
    shortcode: b
  - name: loop
    doc: |
      Repeatedly execute a given script indefinitely - until an interrupt is
      sent.

      A special condition: a single loop iteration must take at least 100ms,
      otherwise after the first iteration the command will error out.

      Unless you have a repeat _inside_ of the loop that exceeds it, the loop is
      not limited by the repeat limit.

      The only way to stop a running loop is `interrupt~`, and putting a loop
      inside of a loop is obviously pointless.

      ```tpn
      stalling: repeat:5:" wait~ up~ "~
      ```
    args:
    - name: script
      doc: a script string that _will not have it's vars expanded_
      optional: false
    permission: Subscriber
  - name: math
    doc: |
      Evaluates and prints a given math expression. Mostly useful for debugging
      my calculator bugs :(
    args:
    - name: value
      doc: a number
      optional: false
    sender_gate: '3s'
  - name: set
    doc: |
      Stores text that will be replaced in any commands you
      call (including macros) if you reference it as `%name`.

      Note that while this command accepts text, an argument wrapped in
      parenthesis - without quotes or braces - will be passed through the
      calculator first as if the command expected a number.
    args:
    - name: name
      doc: string
      optional: false
    - name: value
      doc: string, optional
      optional: true
  - name: let
    doc: |
      Similar to `set~`, but the text is only stored for the chat message being executed.
    args:
    - name: name
      doc: string
      optional: false
    - name: value
      doc: string, optional
      optional: true
  - name: del
    doc: |
      Deletes a variable. Can delete more than one at once.
    args:
    - name: names
      doc: the rest of the arguments
      optional: false
  - name: list-vars
    doc: |
      Lists all of your variables.
    sender_gate: '5s'
  - name: get
    doc: |
      A debug command that replies with the value of the given variable.
    args:
    - name: name
      doc: string
      optional: false
    sender_gate: '5s'
  - name: clear
    doc: |
      Clears all of your variables.
  - name: if-eq
    doc: |
      Runs the `then` script if given values are equal, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: string
      optional: false
    - name: b
      doc: string
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
  - name: if-ne
    doc: |
      Runs the `then` script if given values are not equal, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: string
      optional: false
    - name: b
      doc: string
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
  - name: if-ge
    doc: |
      Runs the `then` script if the first number is greater than or equal to the second, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: a number
      optional: false
    - name: b
      doc: a number
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
  - name: if-gt
    doc: |
      Runs the `then` script if the first number is greater than the second, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: a number
      optional: false
    - name: b
      doc: a number
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
  - name: if-le
    doc: |
      Runs the `then` script if the first number is less than or equal to the second, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: a number
      optional: false
    - name: b
      doc: a number
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
  - name: if-lt
    doc: |
      Runs the `then` script if the first number is less than the second, otherwise runs the `else` script if given.
    args:
    - name: a
      doc: a number
      optional: false
    - name: b
      doc: a number
      optional: false
    - name: then
      doc: a script string
      optional: false
    - name: else
      doc: a script string, optional
      optional: true
- name: Moderation
  commands:
  - name: banish
    doc: |
      Instantly banish a user to the shadow realm.

      Can be temporary if a duration is provided.
    args:
    - name: chatter
      doc: a user login
      optional: false
    - name: duration
      doc: duration in freeform format (using `humantime` Rust library), so `10s`, or `2 minutes` or `1h30m` etc, optional
      optional: true
    permission: TwitchStaff
  - name: unbanish
    doc: |
      Restore users ability to use the bot, bringing them back from the shadow
      realm regardless of their crimes.
    args:
    - name: chatter
      doc: a user login
      optional: false
    permission: Moderator
  - name: banished
    doc: |
      Check if a user was yeeted into the shadow realm.

      If _you_ are yeeted, the bot ignores you utterly, so this won't work
      ¯\\\_(ツ)_/¯.
    args:
    - name: chatter
      doc: a user login
      optional: false
    sender_gate: '15s'
- name: Sounds
  commands:
  - name: tts
    doc: |
      Say something on stream through the TTS.

      Only works for >= subscriber level, or from global macros.
    args:
    - name: msg
      doc: string
      optional: false
    sender_gate: '1m'
  - name: play-sound
    doc: |
      Play a sound on stream.
      Sounds ids are secret.
      And also the command can only be run from global macros anyway ¯\_(ツ)_/¯.

      Dynamic sender gate 1 minute per sound for now.
    args:
    - name: sound-id
      doc: string
      optional: false
  - name: now-playing
    doc: |
      Get the title of the song that's currently playing on stream, if any.
    global_gate: '5s'
    shortcode: np
  - name: skip
    doc: |
      Skips the song that's currently playing on stream, if any.

      This will cost you 1 charge, unless you're VIP or higher.
    global_gate: '15s'
  - name: song-request
    doc: |
      Adds the given song to the YouTube Music queue.

      This only accepts YouTube links or IDs.

      Note that the song will be added to the front of the queue - this is
      because usually the queue is full of songs from my stream playlist and the
      point of the command is to show me a song you think I wont insta-skip :)
    args:
    - name: url-or-id
      doc: string
      optional: false
    sender_gate: '1m'
    shortcode: sr
  - name: volume
    doc: |
      Set YouTube Music volume.
    args:
    - name: volume
      doc: a number in range from 0 to 100
      optional: false
    permission: Vip
    sender_gate: '3s'
- name: Stats
  commands:
  - name: stat
    doc: |
      Count the amount of messages typed by a chatter.

      If given a word, counts the messages containing it (given string can give
      multiple words separated by spaces).

      Login defaults to the sender (you can do `stat::word~` too).
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    - name: word
      doc: string, optional
      optional: true
    sender_gate: '3s'
  - name: stat-global
    doc: |
      Similar to `stat` except works across all of chat.

      Without an argument counts all messages ever typed in chat since I started
      archiving it (which is way before the Twitch Plays Noita happened).

      With an argument filters messages by the given word(s), just like `stat`.
    args:
    - name: word
      doc: string, optional
      optional: true
    sender_gate: '3s'
  - name: first-message
    doc: |
      Get the first message sent by a user (or you) in chat.
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '3s'
  - name: last-message
    doc: |
      Get the last message sent by a user (or you) in chat.
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '3s'
  - name: top
    doc: |
      Get a list of top-N chatters of all time, by number of sent messages.
    args:
    - name: 'n'
      doc: a number in range from 1 to 15, optional
      optional: true
    sender_gate: '10m'
  - name: rank
    doc: |
      Get the place of the chatter (or you) in the "leaderboard" of how many messages they ~~spammed~~ sent
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '1m'
- name: Util
  commands:
  - name: ping
    doc: |
      Respond with "pong!".

      I heard that scarcity creates value, so getting a pong is very _cool_ and
      _pog_, because only one person can get it in an hour.

      Also this gives you a charge :)
    global_gate: '1h'
  - name: echo
    doc: |
      A building block for basic static text commands.

      This just makes the bot print the given text, but non-moderators can only call it through global macros.

      So you can call a global macro `discord~` which will resolve to `echo:"discord link etc"~` and print it.
    args:
    - name: text
      doc: string
      optional: false
    sender_gate: '5s'
  - name: last-error
    doc: |
      Respond with the last error message for user.

      Last error message is set when you run invalid commands, or if the command
      execution managed to crash somehow. In the latter case, you'll be given the
      message id - please send it to me to look at logs and fix the issue.
    args:
    - name: chatter
      doc: a user login, defaults to you
      optional: true
    sender_gate: '3s'
  - name: is-game-running
    doc: |
      Check if noita.exe process is present, aka not dead.
    sender_gate: '1m'
  - name: wait
    doc: |
      Wait for a specified duration milliseconds.

      Very useful for multi-command messages.
    args:
    - name: duration
      doc: duration in milliseconds, will be limited to at most 300000, defaults to 500
      optional: true
    shortcode: w
  - name: break
    doc: |
      Complete all current holds immediately.

      "Holds" here are referring to all "non-instantaneous" commands that are
      currently being executed **right now** - so movement, `hold~` and `wait~`.

      This is kind of a niche thing, most likely you need `interrupt~`.
    args:
    - name: chatter
      doc: a user login, optional
      optional: true
  - name: interrupt
    doc: |
      Stop running all current commands.

      This is similar to `break~`, except the commands following the holds that
      get completed do not run.
    args:
    - name: chatter
      doc: a user login, optional
      optional: true
  - name: discard
    doc: |
      Interrupt all commands *originating from the current message*.

      On it's own this does nothing, but it can be used to limit the duration of
      the current message or similar.
  - name: flag
    doc: |
      Set a bot flag.

      Flags that currently do things are:
      - `full-stop`: disables processing any commands from non-mods
      - `no-restarts`: disables the game restarting on player death
      - `nightmare`: enables the nightmare mode

      If the flag argument is prefixed with `-` it is removed if it was set
      previously.
    args:
    - name: flag
      doc: string
      optional: false
    permission: Moderator
  - name: set-nightmare
    doc: |
      Makes the bot start the game in nightmare/ng.
    args:
    - name: value
      doc: a boolean value (true/t/yes/y/1 or false/f/no/n/0)
      optional: false
    permission: Vip
  - name: fix-seed
    doc: |
      Makes the bot start the game with a specific seed.
    args:
    - name: seed
      doc: a non-negative number
      optional: false
    permission: Vip
  - name: unfix-seed
    doc: |
      Undoes the effect of `fix_seed~`, so the game will start with a random seed again.
    permission: Vip
  - name: what-is
    doc: |
      Get information about a macro or command.

      If you see someone running some weird command, run
      `what-is:command:their-name~` to figure out what it was.
    args:
    - name: name
      doc: string
      optional: false
    - name: to
      doc: a user login, defaults to you
      optional: true
    sender_gate: '3s'
- name: Voting
  commands:
  - name: 'yes'
    doc: |
      Vote yes in an ongoing vote.
  - name: 'no'
    doc: |
      Vote no in an ongoing vote.
  - name: is-vote
    doc: |
      Check if there is an ongoing vote and what it is about.
    global_gate: '10s'
  - name: votekick
    doc: |
      If several(!) people run this command with the same Twitch **login** (this
      is important, use their login, not display name) as an argument - this will
      start a vote to send that user to the shadow realm.

      The vote has to have >=70% yes votes for them to get yeeted.

      By "shadow realm" I mean that their commands will be ignored - initially
      for an hour, but if they get voted for the second time then _forever_,
      unless a moderator clears them.

      This is obviously to deal with trolls and other problematic users. Channel
      moderators and above are immune.

      Be aware that there can be only one vote at a time and this command has a
      large per-user cooldown, so dont waste it.
    args:
    - name: chatter
      doc: a user login
      optional: false
    sender_gate: '5m'
permissions:
- name: Caster
  description: Only the broadcaster can use this command.
  level: 7
- name: Moderator
  description: Channel moderators and above can use this command.
  level: 6
- name: TwitchAdmin
  description: Twitch administrators and above can use this command.
  level: 5
- name: TwitchStaff
  description: Twitch staff and above can use this command.
  level: 4
- name: Vip
  description: Channel VIPs and above can use this command.
  level: 3
- name: Verified
  description: Verified users (partners) and above can use this command.
  level: 2
- name: Subscriber
  description: Channel subscribers and above can use this command.
  level: 1
- name: Viewer
  description: Anyone can use this command.
  level: 0

